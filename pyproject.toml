[project]
name = "glycolens"
version = "0.1.0"
description = "Inference-first glucose forecasting capstone research and application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.142.1",
    "pydantic==2.13.5",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.9",
]
chronos = [
    "chronos-forecasting==2.3.2",
    "psutil==7.2.2",
]
plotting = [
    "matplotlib==3.11.2",
]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra"
testpaths = ["tests", "backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs", "graphify-out"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
