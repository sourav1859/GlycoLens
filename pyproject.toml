[project]
name = "glycolens"
version = "0.1.0"
description = "Inference-first glucose forecasting capstone research and application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.142.1",
    "pydantic==2.13.5",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "tzdata==2026.4",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.9",
]
chronos = [
    "chronos-forecasting==2.3.2",
    "psutil==7.2.2",
    "torch==2.14.0",
]
plotting = [
    "matplotlib==3.11.2",
]
timesfm = [
    "timesfm[torch]==3.0.2",
]
refinement = [
    "scikit-learn==1.7.2",
    "lightgbm==4.6.0",
]
data-audit = [
    "duckdb==1.4.4",
]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra"
testpaths = ["tests", "backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs", "graphify-out"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# Linux containers run CPU inference. Keep the existing Windows/macOS source.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
