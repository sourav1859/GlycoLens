name: Offline application checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.5'
      - run: python -m pip install uv==0.9.18
      - run: uv sync --frozen --group dev
      - run: uv run --no-sync python -m pytest -p scripts.quality.offline_pytest backend/tests tests/quality tests/contract tests/database tests/research/models/test_forecast_adapters.py tests/research/test_pymgipsim.py -q
      - run: uv run --no-sync python -m scripts.quality.check_api_contract
      - run: uv run --no-sync python -m scripts.quality.check_public_files
      - run: uv run --no-sync python -m scripts.quality.validate_skills
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm frontend:check
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: pnpm --dir frontend exec playwright test e2e/responsive-shell.spec.ts e2e/meal-pages.spec.ts e2e/meal-workflow.spec.ts e2e/account-deletion.spec.ts e2e/logout.spec.ts
