name: Opt-in cloud development validation
on:
  workflow_dispatch:
    inputs:
      run_cloud:
        description: Validate the dedicated development target using protected secrets
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  cloud-preflight:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected && inputs.run_cloud && vars.GLYCOLENS_CLOUD_TESTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: glycolens-development
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.5'
      - run: python -m pip install uv==0.9.18
      - run: uv sync --frozen --group dev
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - run: uv run --no-sync python -m scripts.dev.cloud_preflight
        env:
          GLYCOLENS_CLOUD_PROJECT_REF: ecynkzptuslkuhjikzfc
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - run: uv run --no-sync python -m scripts.dev.cloud_integration --allow-cloud --output .cache/ci-cloud-validation.json
        env:
          GLYCOLENS_CLOUD_PROJECT_REF: ecynkzptuslkuhjikzfc
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
