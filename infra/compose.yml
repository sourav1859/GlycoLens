name: glycolens
services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file: ../.env
    environment:
      GLYCOLENS_CORS_ORIGINS: https://${GLYCOLENS_DOMAIN:?Set the deployment domain}
      HF_HUB_OFFLINE: '1'
    ports: ['127.0.0.1:8000:8000']
    volumes:
      - ${GLYCOLENS_MODEL_CACHE:?Provide reviewed model cache}:/app/artifacts/models/huggingface:ro
      - simulation:/app/artifacts/simulation
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:?Set cloud URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Set publishable key}
        NEXT_PUBLIC_API_URL: https://${GLYCOLENS_DOMAIN}
    ports: ['127.0.0.1:3000:3000']
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  simulation:
